<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --panel: #ffffff;
      --text: #1c2434;
      --muted: #5b677a;
      --border: #e3e8f2;
      --user: #2563eb;
      --user-text: #ffffff;
      --ai: #eef2ff;
      --ai-text: #1c2434;
      --input: #f8fafc;
      --shadow: 0 18px 50px rgba(28, 36, 52, 0.08);
    }

    html[data-theme="dark"] {
      --bg: #0b1220;
      --panel: #111827;
      --text: #e8eefc;
      --muted: #9aa8c2;
      --border: #243044;
      --user: #3b82f6;
      --user-text: #ffffff;
      --ai: #1a2436;
      --ai-text: #e8eefc;
      --input: #0f172a;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(860px, 100%);
      height: min(88vh, 860px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0.04em;
    }

    .brand span {
      color: var(--muted);
      font-size: 13px;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    button, .theme-toggle {
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      font-weight: 600;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bubble {
      max-width: 78%;
      padding: 12px 14px;
      border-radius: 16px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user {
      align-self: flex-end;
      background: var(--user);
      color: var(--user-text);
      border-bottom-right-radius: 6px;
    }

    .ai {
      align-self: flex-start;
      background: var(--ai);
      color: var(--ai-text);
      border-bottom-left-radius: 6px;
    }

    .empty, .status {
      color: var(--muted);
      text-align: center;
      margin: auto;
    }

    form {
      display: flex;
      gap: 10px;
      padding: 16px 18px 20px;
      border-top: 1px solid var(--border);
    }

    input {
      flex: 1;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 15px;
    }

    input:focus, button:focus {
      outline: 2px solid #60a5fa;
      outline-offset: 1px;
    }

    form button {
      border: none;
      background: var(--user);
      color: white;
      border-radius: 14px;
      padding: 0 18px;
    }

    form button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <h1>test</h1>
        <span>Chat with Omar's AI</span>
      </div>
      <div class="actions">
        <button type="button" id="reset">New chat</button>
        <button type="button" class="theme-toggle" id="theme">Dark</button>
      </div>
    </header>

    <section id="messages">
      <p class="empty">Say hello to start chatting.</p>
    </section>

    <form id="chat-form">
      <input id="message" type="text" placeholder="Type a message..." autocomplete="off" required>
      <button type="submit" id="send">Send</button>
    </form>
  </main>

  <script>
    const html = document.documentElement;
    const messages = document.getElementById("messages");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message");
    const send = document.getElementById("send");
    const themeBtn = document.getElementById("theme");
    const resetBtn = document.getElementById("reset");

    function setTheme(theme) {
      html.dataset.theme = theme;
      localStorage.setItem("test-theme", theme);
      themeBtn.textContent = theme === "dark" ? "Light" : "Dark";
    }

    setTheme(localStorage.getItem("test-theme") || "light");

    function addBubble(text, role) {
      const empty = messages.querySelector(".empty, .status");
      if (empty) empty.remove();
      const bubble = document.createElement("div");
      bubble.className = `bubble ${role}`;
      bubble.textContent = text;
      messages.appendChild(bubble);
      messages.scrollTop = messages.scrollHeight;
      return bubble;
    }

    themeBtn.addEventListener("click", () => {
      setTheme(html.dataset.theme === "dark" ? "light" : "dark");
    });

    resetBtn.addEventListener("click", async () => {
      await fetch("/reset", { method: "POST" });
      messages.innerHTML = '<p class="empty">Say hello to start chatting.</p>';
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addBubble(text, "user");
      input.value = "";
      send.disabled = true;
      const thinking = addBubble("Thinking...", "ai");

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await response.json();
        thinking.textContent = data.reply || data.error || "No reply.";
      } catch (error) {
        thinking.textContent = "Could not reach the AI. Is the server running?";
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
