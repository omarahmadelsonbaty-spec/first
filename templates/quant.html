<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R Desk — Omar Quant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07110c;
      --panel: #0d1a14;
      --panel-2: #102018;
      --line: #1e3a2c;
      --text: #d7f5e3;
      --muted: #7aa38c;
      --bull: #3ee08a;
      --bear: #ff6b6b;
      --neutral: #e7c66a;
      --accent: #b8ff70;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(1200px 500px at 10% -10%, #143322 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
    }

    .shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 22px;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 18px;
      min-height: 100vh;
    }

    header.brand {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }

    .kicker {
      font-family: "IBM Plex Mono", monospace;
      color: var(--accent);
      letter-spacing: 0.18em;
      font-size: 11px;
      text-transform: uppercase;
      margin: 0 0 6px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: -0.03em;
    }

    .sub {
      color: var(--muted);
      margin: 6px 0 0;
    }

    .meta {
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      color: var(--muted);
      text-align: right;
    }

    .panel {
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--line);
      border-radius: 18px;
    }

    .watch {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .watch-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .watch-head h2 {
      margin: 0;
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    .ghost, .send, .chip {
      border: 1px solid var(--line);
      background: #0a1611;
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .ghost:hover, .chip:hover, .send:hover { border-color: var(--accent); color: var(--accent); }

    .card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.18);
      cursor: pointer;
    }

    .card:hover { border-color: #2d5a42; }

    .card-top, .stats {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .sym {
      font-family: "IBM Plex Mono", monospace;
      font-weight: 600;
      font-size: 18px;
    }

    .badge {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      padding: 4px 8px;
      border-radius: 999px;
    }

    .BULLISH { color: #062; background: color-mix(in srgb, var(--bull) 22%, transparent); color: var(--bull); }
    .BEARISH { background: color-mix(in srgb, var(--bear) 22%, transparent); color: var(--bear); }
    .NEUTRAL { background: color-mix(in srgb, var(--neutral) 22%, transparent); color: var(--neutral); }

    .price {
      font-family: "IBM Plex Mono", monospace;
      font-size: 22px;
      margin: 8px 0 10px;
    }

    .stats span {
      color: var(--muted);
      font-size: 12px;
    }

    .stats b {
      display: block;
      margin-top: 3px;
      font-family: "IBM Plex Mono", monospace;
      font-weight: 500;
      color: var(--text);
    }

    .empty-watch {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .desk {
      display: flex;
      flex-direction: column;
      min-height: 72vh;
      overflow: hidden;
    }

    .desk-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 18px 0;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bubble {
      max-width: 78%;
      padding: 11px 13px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user {
      align-self: flex-end;
      background: #163524;
      border: 1px solid #2a5d40;
    }

    .ai {
      align-self: flex-start;
      background: #0a120e;
      border: 1px solid var(--line);
    }

    .hint {
      margin: auto;
      color: var(--muted);
      text-align: center;
      max-width: 420px;
    }

    form {
      display: flex;
      gap: 10px;
      padding: 14px 18px 18px;
      border-top: 1px solid var(--line);
    }

    input {
      flex: 1;
      border: 1px solid var(--line);
      background: #08140f;
      color: var(--text);
      border-radius: 12px;
      padding: 13px 14px;
      font: 15px "IBM Plex Sans", sans-serif;
    }

    input:focus, button:focus {
      outline: 2px solid #4ade80;
      outline-offset: 1px;
    }

    .send {
      border-radius: 12px;
      background: var(--accent);
      color: #062;
      border: none;
      padding: 0 18px;
      font-weight: 700;
    }

    .send:disabled { opacity: 0.55; cursor: wait; }

    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      header.brand { align-items: start; flex-direction: column; }
      .meta { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="brand">
      <div>
        <p class="kicker">r.py live desk</p>
        <h1>Omar Quant</h1>
        <p class="sub">Price vs 50-day SMA. Strict BULLISH / BEARISH / NEUTRAL calls.</p>
      </div>
      <div class="meta">
        <div>Created by Omar</div>
        <div id="updated">Watchlist loading…</div>
      </div>
    </header>

    <aside class="panel watch">
      <div class="watch-head">
        <h2>Watchlist</h2>
        <button class="ghost" id="refresh" type="button">Refresh</button>
      </div>
      <div id="cards"><p class="empty-watch">Pulling Yahoo Finance data…</p></div>
    </aside>

    <section class="panel desk">
      <div class="desk-head">
        <strong>Quant chat</strong>
        <button class="ghost" id="reset" type="button">New chat</button>
      </div>
      <div class="chips" id="chips"></div>
      <div id="messages">
        <p class="hint">Ask about AAPL, NVDA, MSFT, or GOOG. Click a ticker to drop it into chat.</p>
      </div>
      <form id="chat-form">
        <input id="message" type="text" placeholder="Type a symbol or question…" autocomplete="off" required>
        <button class="send" id="send" type="submit">Send</button>
      </form>
    </section>
  </div>

  <script>
    const messages = document.getElementById("messages");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message");
    const send = document.getElementById("send");
    const cards = document.getElementById("cards");
    const chips = document.getElementById("chips");
    const updated = document.getElementById("updated");

    const fmtVol = (n) => Number(n).toLocaleString();
    const money = (n) => "$" + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    function renderWatchlist(symbols) {
      const entries = Object.entries(symbols || {});
      chips.innerHTML = "";
      if (!entries.length) {
        cards.innerHTML = '<p class="empty-watch">No ticker data yet. Check network access for Yahoo Finance, then refresh.</p>';
        updated.textContent = "Watchlist empty";
        return;
      }

      cards.innerHTML = "";
      entries.forEach(([sym, row]) => {
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <div class="card-top">
            <span class="sym">${sym}</span>
            <span class="badge ${row.signal}">${row.signal}</span>
          </div>
          <div class="price">${money(row.price)}</div>
          <div class="stats">
            <span>50 SMA<b>${money(row.sma_50)}</b></span>
            <span>Volume<b>${fmtVol(row.volume)}</b></span>
          </div>`;
        card.addEventListener("click", () => ask(sym));
        cards.appendChild(card);

        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        chip.textContent = `Analyze ${sym}`;
        chip.addEventListener("click", () => ask(sym));
        chips.appendChild(chip);
      });
      updated.textContent = "Watchlist " + new Date().toLocaleTimeString();
    }

    async function loadWatchlist(refresh) {
      const url = refresh ? "/refresh" : "/watchlist";
      const opts = refresh ? { method: "POST" } : {};
      const res = await fetch(url, opts);
      const data = await res.json();
      renderWatchlist(data.symbols);
    }

    function addBubble(text, role) {
      const hint = messages.querySelector(".hint");
      if (hint) hint.remove();
      const bubble = document.createElement("div");
      bubble.className = `bubble ${role}`;
      bubble.textContent = text;
      messages.appendChild(bubble);
      messages.scrollTop = messages.scrollHeight;
      return bubble;
    }

    async function sendMessage(text) {
      addBubble(text, "user");
      send.disabled = true;
      const thinking = addBubble("Reading the tape…", "ai");
      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await response.json();
        thinking.textContent = data.reply || data.error || "No reply.";
      } catch (error) {
        thinking.textContent = "Could not reach the assistant. Is server.py running?";
      } finally {
        send.disabled = false;
        input.focus();
      }
    }

    function ask(sym) {
      input.value = sym;
      sendMessage(`Analyze ${sym} from the watchlist.`);
      input.value = "";
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      sendMessage(text);
    });

    document.getElementById("reset").addEventListener("click", async () => {
      await fetch("/reset", { method: "POST" });
      messages.innerHTML = '<p class="hint">Ask about AAPL, NVDA, MSFT, or GOOG. Click a ticker to drop it into chat.</p>';
    });

    document.getElementById("refresh").addEventListener("click", () => loadWatchlist(true));

    loadWatchlist(false).catch(() => {
      cards.innerHTML = '<p class="empty-watch">Could not load watchlist.</p>';
    });
  </script>
</body>
</html>
