<!DOCTYPE html>
<html>
<head>
    <title>HTML to Python Connection</title>
</head>
<body>

    <h2>Send Data to Python</h2>
    <input type="text" id="itemName" placeholder="Item Name">
    <input type="number" id="itemPrice" placeholder="Price">
    <button onclick="sendToPython()">Send to Backend</button>

    <h3 id="result"></h3>

    <script>
        async function sendToPython() {
            const name = document.getElementById('itemName').value;
            const price = parseFloat(document.getElementById('itemPrice').value);

            // Fetch sends an HTTP POST request to Python backend
            const response = await fetch('http://127.0.0.1:8000/api/save', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    item_name: name,
                    price: price
                })
            });

            // Parse JSON returned by Python
            const data = await response.json();
            
            // Update HTML UI with Python output
            document.getElementById('result').innerText = 
                `Saved ${data.item}! Estimated Profit: $${data.profit}`;
        }
    </script>
</body>
</html>
